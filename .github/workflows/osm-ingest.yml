# The map load, every day, with nobody pressing anything. See docs/INGEST.md.
#
#   Mondays 06:17 UTC      rebuild the seeds, then refresh EVERY region
#   other days 04:43 UTC   rebuild the seeds, then load only the regions that
#                          need it: never loaded, gained their first seed, or
#                          overdue because their Monday run failed
#
# Every region is read whole. The list builds itself (osm-ingest.mjs --plan):
# every US state and territory, the UK's nations, Mexico, the world list's
# files, and the region of every plan destination and Discover area.
#
# The repository is public, so three rules hold throughout:
#   - the two secrets reach a step only through `env:`, never interpolated
#     into a `run:` line, and nothing prints them;
#   - a person's workflow_dispatch input is handed over through `env:` too,
#     and the script checks it against the regions it knows before using it;
#   - the workflow can read the repository and nothing more.
name: OSM ingest

on:
  schedule:
    # Odd minutes keep us off the top of the hour everybody else picks, and
    # Geofabrik has rebuilt its extracts overnight by then.
    - cron: '17 6 * * 1'
    - cron: '43 4 * * 0,2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'due = only regions never loaded, newly seeded or overdue; all = every region'
        type: choice
        options: [due, all]
        default: due
      region:
        description: 'One Geofabrik region, e.g. north-america/us/north-carolina. Empty = the list the mode picks.'
        required: false
        default: ''
      accept_drop:
        description: 'Accept a run that keeps under half of last time (only after deliberately changing what the load keeps; needs a region).'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# One run at a time, so two runs never download at once (Geofabrik asks for
# no more than two downloads at a time, and the batches below are two).
concurrency:
  group: osm-ingest
  cancel-in-progress: false

jobs:
  seeds:
    name: Seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Every plan destination and Discover area, placed and filed under the
      # Geofabrik files its circle reaches. Nominatim is asked only about
      # towns never placed before, once a second, at most 100 a run; a 429
      # stops the asking with a warning, not a failure, and the rest are
      # placed tomorrow. Names are never printed: this log is public.
      - name: Rebuild the seeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest/build-seeds.mjs --write

  plan:
    name: Which regions
    needs: seeds
    # A seeds run that failed does not stop the load: the seeds already
    # stored still name every region, and the Seeds job shows red on its own.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.list.outputs.count }}
      batch1: ${{ steps.list.outputs.batch1 }}
      batch2: ${{ steps.list.outputs.batch2 }}
      batch3: ${{ steps.list.outputs.batch3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          ONLY_REGION: ${{ github.event.inputs.region }}
          ACCEPT_DROP: ${{ github.event.inputs.accept_drop }}
        run: |
          # accept_drop switches off the half-of-last-time guard. It is for
          # one region after a deliberate change; with the region left empty
          # it would switch the guard off everywhere, and a region that lost
          # most of its extract upstream that week would be recorded as good.
          if [ "$ACCEPT_DROP" = "true" ] && [ -z "${ONLY_REGION// /}" ]; then
            echo "::error::accept_drop needs a region: name the one whose count is meant to drop"
            exit 1
          fi
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "17 6 * * 1" ]; then mode=all; else mode=due; fi
          else
            mode="${INPUT_MODE:-due}"
          fi
          if [ -n "${ONLY_REGION// /}" ]; then
            node scripts/ingest/osm-ingest.mjs --plan --region "$ONLY_REGION" > plan.json
          elif [ "$mode" = "all" ]; then
            node scripts/ingest/osm-ingest.mjs --plan > plan.json
          else
            node scripts/ingest/osm-ingest.mjs --plan --due > plan.json
          fi
          node -e '
            const fs = require("fs");
            const plan = JSON.parse(fs.readFileSync("plan.json", "utf8"));
            const out = [`count=${plan.count}`, ...plan.batches.map((b, i) => `batch${i + 1}=${JSON.stringify(b)}`)];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(`mode ${process.argv[1]}: ${plan.count} regions in batches of ${plan.batches.map(b => b.length).join(", ")}`);
          ' "$mode"

  # Three batches, one after another, because GitHub runs at most 256 jobs
  # from one matrix. Each is two at a time. A batch runs whether or not the
  # one before had a red region: one region failing never stops the others.
  batch-1:
    name: Load
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch1 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.batch1) }}
    uses: ./.github/workflows/osm-ingest-region.yml
    with:
      region: ${{ matrix.region }}
      minutes: ${{ matrix.minutes }}
      accept_drop: ${{ github.event.inputs.accept_drop == 'true' }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  batch-2:
    name: Load
    needs: [plan, batch-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch2 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.batch2) }}
    uses: ./.github/workflows/osm-ingest-region.yml
    with:
      region: ${{ matrix.region }}
      minutes: ${{ matrix.minutes }}
      accept_drop: ${{ github.event.inputs.accept_drop == 'true' }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  batch-3:
    name: Load
    needs: [plan, batch-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.batch3 != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.batch3) }}
    uses: ./.github/workflows/osm-ingest-region.yml
    with:
      region: ${{ matrix.region }}
      minutes: ${{ matrix.minutes }}
      accept_drop: ${{ github.event.inputs.accept_drop == 'true' }}
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # What the weather is usually like in every place above, from NASA POWER's
  # climatology (scripts/ingest/climate.mjs, sql/climate-2026-09-24.sql).
  # Its own job, needing nothing: a failure here shows red on the run and
  # never stops or delays the map load. Only places with no row, or a row
  # over a year old, are fetched — forty-year averages do not move — so most
  # runs read the table and ask POWER for nothing.
  climate:
    name: Climate normals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fill what is missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ingest/climate.mjs --cap 150
